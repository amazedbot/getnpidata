name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore getnpidata.sln

      - name: Build
        run: dotnet build getnpidata.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution getnpidata.sln --no-build --configuration Release
